name: Build editor

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-editor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Build and test (Windows x64, RelWithDebInfo)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_FEATURE_FLAGS: "manifests,binarycaching"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve vcpkg revision
        id: vcpkg-rev
        run: |
          $sha = (git -C vendor/vcpkg rev-parse HEAD).Trim()
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "vcpkg submodule @ $sha"

      - name: Enable MSVC dev cmd (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache vcpkg.exe
        id: cache-vcpkg-bin
        uses: actions/cache@v4
        with:
          path: vendor/vcpkg/vcpkg.exe
          key: vcpkg-bin-${{ runner.os }}-${{ steps.vcpkg-rev.outputs.sha }}-${{ hashFiles('vendor/vcpkg/bootstrap-vcpkg.bat', 'vendor/vcpkg/scripts/bootstrap.ps1') }}

      - name: Bootstrap vcpkg
        if: steps.cache-vcpkg-bin.outputs.cache-hit != 'true'
        run: .\vendor\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Print toolchain versions
        run: |
          .\vendor\vcpkg\vcpkg.exe version
          cmake --version
          ninja --version
          cl.exe 2>&1 | Select-Object -First 1

      - name: Cache vcpkg binary archives (Qt)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-archives-editor-${{ runner.os }}-x64-windows-${{ steps.vcpkg-rev.outputs.sha }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-archives-editor-${{ runner.os }}-x64-windows-${{ steps.vcpkg-rev.outputs.sha }}-
            vcpkg-archives-editor-${{ runner.os }}-x64-windows-

      - name: Configure (CMake + Ninja)
        run: cmake --preset editor

      - name: Build
        run: cmake --build --preset editor

      - name: Widget tests
        run: |
          .\build-editor\editor_widget_tests.exe
          if ($LASTEXITCODE -ne 0) { throw "editor_widget_tests failed (exit $LASTEXITCODE)" }

      - name: Window tests
        run: |
          .\build-editor\editor_window_tests.exe
          if ($LASTEXITCODE -ne 0) { throw "editor_window_tests failed (exit $LASTEXITCODE)" }

      - name: Verify build output
        run: |
          $exe = "build-editor\ifs_editor.exe"
          if (!(Test-Path $exe)) {
            throw "$exe not produced by build"
          }
          $size = (Get-Item $exe).Length
          Write-Host "ifs_editor.exe: $size bytes"
          if ($size -lt 1MB) {
            throw "$exe is suspiciously small ($size bytes) - link probably failed"
          }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOff = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOff + 4)
          Write-Host ("machine = 0x{0:x} (expected 0x8664)" -f $machine)
          if ($machine -ne 0x8664) {
            throw ("$exe has PE machine 0x{0:x}, expected 0x8664" -f $machine)
          }
          foreach ($plugin in "platforms\qwindows.dll", "imageformats\qjpeg.dll", "imageformats\qsvg.dll") {
            if (!(Test-Path "build-editor\$plugin")) {
              throw "build-editor\$plugin was not deployed"
            }
          }

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: editor-win64-${{ github.sha }}
          path: |
            build-editor/ifs_editor.exe
            build-editor/ifs_editor.pdb
            build-editor/*.dll
            build-editor/platforms/
            build-editor/imageformats/
            build-editor/iconengines/
          if-no-files-found: error
          retention-days: 30
