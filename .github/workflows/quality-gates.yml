name: Quality gates

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: Gates (fast, no toolchain)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: tools/ci/uv.lock

      - name: File length gate
        run: uv run --project tools/ci python tools/ci/check_file_length.py

      - name: No-comments gate
        run: uv run --project tools/ci python tools/ci/check_no_comments.py

      - name: Banned-characters gate
        run: uv run --project tools/ci python tools/ci/check_banned_chars.py

      - name: Machine-path gate
        run: uv run --project tools/ci python tools/ci/check_machine_paths.py

      - name: GUI-isolation gate
        run: uv run --project tools/ci python tools/ci/check_gui_isolation.py

      - name: Host isolation
        run: uv run --project tools/ci python tools/ci/check_host_isolation.py

      - name: Format gate
        run: uv run --project tools/ci python tools/ci/run_format.py

      - name: Preset gate self-test
        run: uv run pytest -q
        working-directory: tools/ci

      - name: Ruff (tools lint)
        run: uv run --project tools/ci --group dev ruff check tools/
