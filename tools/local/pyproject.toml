[project]
name = "r573-local-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pefile==2024.8.26",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "PL"]
ignore = ["PLC0415", "PLR0911", "PLR0912", "PLR0915", "PLR2004"]
